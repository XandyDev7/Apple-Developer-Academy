
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xandydrv — Portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
 
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:      #0D0D12;
      --surface: #16151F;
      --border:  #2A2837;
      --accent:  #7C3AED;
      --accent2: #A78BFA;
      --text:    #E8E6F0;
      --muted:   #6B6880;
      --radius:  10px;
    }
 
    html { scroll-behavior: smooth; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 1.5rem;
    }
 
    /* ── HEADER ── */
    header {
      max-width: 780px;
      margin: 0 auto;
      padding: 5rem 0 3.5rem;
      border-bottom: 1px solid var(--border);
    }
 
    .tag {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--accent2);
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
 
    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
    }
 
    header h1 span { color: var(--accent2); }
 
    header p {
      margin-top: 1rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 50ch;
    }
 
    /* ── MAIN ── */
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 3rem 0 6rem;
    }
 
    .section-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
 
    .projects {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
 
    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .2s;
    }
 
    .card:hover { border-color: var(--accent); }
    .card.open  { border-color: var(--accent2); }
 
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      gap: 1rem;
      user-select: none;
    }
 
    .card-left {
      display: flex;
      align-items: center;
      gap: .9rem;
      min-width: 0;
    }
 
    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: rgba(124,58,237,.18);
      border: 1px solid rgba(124,58,237,.3);
    }
 
    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .card-type {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: .1rem;
    }
 
    .chevron {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform .28s ease, color .2s;
    }
 
    .card.open .chevron {
      transform: rotate(180deg);
      color: var(--accent2);
    }
 
    /* ── BODY ACCORDION ── */
    .card-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s ease;
    }
 
    .card.open .card-body { grid-template-rows: 1fr; }
 
    .card-body-inner { overflow: hidden; }
 
    .card-body-content {
      padding: 1.2rem 1.4rem 1.4rem;
      border-top: 1px solid var(--border);
    }
 
    /* ── DESCRIÇÃO FIXA ── */
    .card-description {
      font-size: .875rem;
      line-height: 1.7;
      color: #C4C0D8;
    }
 
    /* ── RODAPÉ DO CARD ── */
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 1.1rem;
    }
 
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .78rem;
      font-weight: 500;
      color: var(--accent2);
      text-decoration: none;
      padding: .4rem .85rem;
      border: 1px solid rgba(167,139,250,.3);
      border-radius: 20px;
      transition: background .2s, border-color .2s;
    }
 
    .link-btn:hover {
      background: rgba(124,58,237,.15);
      border-color: var(--accent2);
    }
 
    /* ── FOOTER ── */
    footer {
      max-width: 780px;
      margin: 0 auto;
      padding: 2rem 0 3rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
    }
 
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .15s;
    }
 
    footer a:hover { color: var(--accent2); }
 
    @media (max-width: 500px) {
      .card-title        { font-size: .88rem; }
      header h1          { font-size: 2rem; }
      .card-header       { padding: .9rem 1rem; }
      .card-body-content { padding: .9rem 1rem 1rem; }
    }
  </style>
</head>
<body>
 
  <header>
    <div class="tag">portfólio</div>
    <h1>xandy<span>drv</span></h1>
    <p>Uma coleção de projetos — clique em cada card para ler sobre o projeto.</p>
  </header>
 
  <main>
    <p class="section-label">projetos</p>
    <div class="projects" id="projects"></div>
  </main>
 
  <footer>
    <span>xandydrv</span>
    <a href="https://github.com/xandydrv" target="_blank" rel="noopener">github.com/xandydrv ↗</a>
  </footer>
 
  <script>
    const PROJECTS = [
      {
        id: "aas",
        icon: "🏅",
        title: "aas",
        type: "GitHub Pages — Agrinho",
        url: "https://xandydrv.github.io/aas",
        urlLabel: "Abrir site",
        description: "Representei minha escola em um campeonato estadual chamado Agrinho. Este projeto foi desenvolvido para essa competição e marca uma conquista importante na minha trajetória no ensino médio.",
      },
      {
        id: "0000000",
        icon: "🎓",
        title: "0000000",
        type: "GitHub Pages — Ensino Médio",
        url: "https://xandydrv.github.io/0000000",
        urlLabel: "Abrir site",
        description: "Este projeto marca a história de como foi meu ensino médio. Um dos melhores projetos que desenvolvi, cheio de memórias e aprendizados que moldaram minha jornada na programação.",
      },
      {
        id: "cp",
        icon: "🏆",
        title: "cp",
        type: "Repositório GitHub",
        url: "https://cp-smoky-ten.vercel.app/",
        urlLabel: "Ver no Vercel",
        description: "Este projeto trata-se sobre a história da tecnologia, abordando sua evolução ao longo do tempo de forma didática e visual.",
      },
      {
        id: "buiu-trab",
        icon: "🌐",
        title: "buiu-trab",
        type: "GitHub Pages — Quiz",
        url: "https://xandydrv.github.io/buiu-trab",
        urlLabel: "Abrir site",
        description: "Um quiz interativo com perguntas sobre conteúdos básicos do ensino médio. Desenvolvido para tornar o aprendizado mais dinâmico e divertido.",
      },
      {
        id: "biblioteca-book",
        icon: "📚",
        title: "biblioteca-book",
        type: "GitHub Pages — Biblioteca",
        url: "https://xandydrv.github.io/biblioteca-book-/#",
        urlLabel: "Abrir site",
        description: "Uma página que exibe um acervo básico de livros em formato de biblioteca virtual, com visual limpo e navegação simples.",
      },
      {
        id: "the-forgotten-london",
        icon: "🎮",
        title: "The Forgotten London",
        type: "Jogo — itch.io",
        url: "https://xandyd7.itch.io/the-forgottenlondon",
        urlLabel: "Jogar no itch.io",
        description: "Um jogo desenvolvido e publicado no itch.io. Explore a Londres esquecida em uma aventura que mistura mistério e atmosfera sombria.",
      },
    ];
 
    const container = document.getElementById("projects");
 
    const LINK_ICON = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1h4v4"/><path d="M11 1 5.5 6.5"/><path d="M5 2H2a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V8"/></svg>`;
 
    PROJECTS.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "card-" + p.id;
 
      card.innerHTML = `
        <div class="card-header" role="button" aria-expanded="false" tabindex="0">
          <div class="card-left">
            <div class="card-icon">${p.icon}</div>
            <div>
              <div class="card-title">${p.title}</div>
              <div class="card-type">${p.type}</div>
            </div>
          </div>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="5 8 10 13 15 8"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-body-inner">
            <div class="card-body-content">
              <p class="card-description">${p.description}</p>
              <div class="card-meta">
                <a class="link-btn" href="${p.url}" target="_blank" rel="noopener">
                  ${LINK_ICON} ${p.urlLabel}
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
 
      container.appendChild(card);
 
      const header = card.querySelector(".card-header");
 
      function toggle() {
        const isOpen = card.classList.toggle("open");
        header.setAttribute("aria-expanded", isOpen);
      }
 
      header.addEventListener("click", toggle);
      header.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
  </script>
</body>
</html>
